<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember Me!</title>
    <!-- Link the mobile manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Background image settings */
            background-image: url('https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi.pinimg.com%2F736x%2F81%2F23%2Feb%2F8123ebd04ed213c7001c17ad0364ba49.jpg&f=1&nofb=1&ipt=485ba6a47671713c75a3894f15eed2501156ac11c6b9e0c5fed6f108d5cedf9c&ipo=images');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        /* Container card to make text readable over the background */
        .app-container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 20px;
            width: 80%;
        }

        p {
            line-height: 1.6;
            color: #444;
        }

        #birthday-alert {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        #notify-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            width: 100%;
        }

        #notify-btn:hover {
            background-color: #0056b3;
        }

        .token-box {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .token-box label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }

        #fcm-token-input {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background: #f9f9f9;
            color: #222;
            margin-bottom: 8px;
        }

        #copy-token-btn {
            width: 100%;
            padding: 8px 12px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            background-color: #6c757d;
            color: white;
            cursor: pointer;
        }

        #copy-token-btn:hover {
            background-color: #545b62;
        }

        .support-link {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <button id="notify-btn">🔔 Enable App Notifications</button>
        <div id="birthday-alert"></div>

        <h1>Remember Me!</h1>
        <label for="person">Choose a person:</label><br>
        <select id="person">
          <option value="">Select a name</option>
        </select>
        <p id="result"></p>

        <div class="token-box">
            <label for="fcm-token-input">Device FCM Token:</label>
            <input id="fcm-token-input" type="text" readonly placeholder="Enable notifications to generate token...">
            <button id="copy-token-btn" type="button">📋 Copy Token</button>
        </div>

        <div class="support-link">
            <a href="mailto:itpeter002@gmail.com" style="color: #007bff; text-decoration: none; font-size: 14px;">Connect support here</a>
        </div>
    </div>

<script>
  const people = {
    "Apa": "1979-08-26",
    "Anya": "1981-08-23",
    "Tomi": "2012-01-18",
    "Petya": "2014-04-04"
  };

  const menu = document.querySelector("#person");
  const result = document.querySelector("#result");
  const alertBox = document.querySelector("#birthday-alert");
  const notifyBtn = document.querySelector("#notify-btn");
  const tokenInput = document.querySelector("#fcm-token-input");
  const copyTokenBtn = document.querySelector("#copy-token-btn");

  copyTokenBtn.addEventListener("click", async () => {
    if (!tokenInput.value) return;
    try {
      await navigator.clipboard.writeText(tokenInput.value);
      copyTokenBtn.textContent = "✅ Copied!";
      setTimeout(() => {
        copyTokenBtn.textContent = "📋 Copy Token";
      }, 2000);
    } catch {
      tokenInput.select();
      document.execCommand("copy");
      copyTokenBtn.textContent = "✅ Selected / Copied!";
    }
  });

  for (const name of Object.keys(people)) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    menu.appendChild(option);
  }

  function updateButtonUI() {
    if (!("Notification" in window)) {
      notifyBtn.textContent = "Notifications not supported";
      notifyBtn.disabled = true;
    } else if (Notification.permission === "granted") {
      notifyBtn.textContent = "✅ App Notifications Enabled";
      notifyBtn.style.backgroundColor = "#28a745";
    }
  }

  function checkBirthdays() {
    const today = new Date();
    const thisYear = today.getFullYear();
    const todayUTC = Date.UTC(thisYear, today.getMonth(), today.getDate());

    let alertMessages = [];

    for (const [name, dateStr] of Object.entries(people)) {
      const [birthYear, birthMonth, birthDay] = dateStr.split("-").map(Number);

      let birthdayThisYear = Date.UTC(thisYear, birthMonth - 1, birthDay);
      let targetYear = thisYear;

      if (todayUTC > birthdayThisYear) {
        targetYear = thisYear + 1;
        birthdayThisYear = Date.UTC(targetYear, birthMonth - 1, birthDay);
      }

      const daysUntil = Math.round((birthdayThisYear - todayUTC) / (1000 * 60 * 60 * 24));
      const ageNext = targetYear - birthYear;

      if (daysUntil === 10 || daysUntil === 1 || daysUntil === 0) {
        let title = "";
        let body = "";

        if (daysUntil === 10) {
          title = `⏳ 10 Days until ${name}'s birthday!`;
          body = `${name} will turn ${ageNext} in 10 days! Time to prepare a gift!`;
        } else if (daysUntil === 1) {
          title = `⚠️ Tomorrow is ${name}'s birthday!`;
          body = `${name} will turn ${ageNext} tomorrow!`;
        } else if (daysUntil === 0) {
          title = `🎉 Happy Birthday to ${name}!`;
          body = `Today is ${name}'s birthday! They are turning ${ageNext}.`;
        }

        alertMessages.push(body);

        const storageKey = `notified_${name}_${targetYear}_${daysUntil}`;

        if (Notification.permission === "granted" && !localStorage.getItem(storageKey)) {
          navigator.serviceWorker.ready.then(registration => {
            registration.showNotification(title, {
              body: body,
              icon: "icon.png",
              requireInteraction: true
            });
          });
          localStorage.setItem(storageKey, "true");
        }
      }
    }

    if (alertMessages.length > 0) {
      alertBox.style.display = "block";
      alertBox.innerHTML = `🔔 <strong>Upcoming Milestones:</strong><br>` + alertMessages.join("<br>");
    }
  }

  menu.addEventListener("change", () => {
    const name = menu.value;
    if (!name) {
      result.textContent = "";
      return;
    }

    const [birthYear, birthMonth, birthDay] = people[name].split("-").map(Number);
    const today = new Date();
    const thisYear = today.getFullYear();
    const todayUTC = Date.UTC(thisYear, today.getMonth(), today.getDate());

    let ageNow = thisYear - birthYear;
    const birthdayThisYear = Date.UTC(thisYear, birthMonth - 1, birthDay);
    if (todayUTC < birthdayThisYear) {
      ageNow--;
    }

    let targetYear = thisYear;
    let targetBirthday = birthdayThisYear;
    if (todayUTC > birthdayThisYear) {
      targetYear = thisYear + 1;
      targetBirthday = Date.UTC(targetYear, birthMonth - 1, birthDay);
    }

    const ageNext = targetYear - birthYear;
    const daysUntil = Math.round((targetBirthday - todayUTC) / (1000 * 60 * 60 * 24));

    const weeks = Math.floor(daysUntil / 7);
    const days = daysUntil % 7;

    let timeText = "";
    if (daysUntil === 0) {
      timeText = "Their birthday is today!";
    } else {
      let parts = [];
      if (weeks > 0) parts.push(`${weeks} week${weeks === 1 ? "" : "s"}`);
      if (days > 0 || weeks === 0) parts.push(`${days} day${days === 1 ? "" : "s"}`);
      timeText = `${parts.join(" and ")} until their birthday.`;
    }

    result.innerHTML =
      `<strong>${name}</strong> is currently <strong>${ageNow}</strong> years old.<br>` +
      `They will turn <strong>${ageNext}</strong> on their next birthday.<br>` +
      `🕒 ${timeText}`;
  });
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB66TW4s5t4wad27trMjxJ6ydrteV0HyaY",
    authDomain: "rememberme002.firebaseapp.com",
    projectId: "rememberme002",
    storageBucket: "rememberme002.firebasestorage.app",
    messagingSenderId: "180226745748",
    appId: "1:180226745748:web:69027dbdbfd98dd2121b81"
  };

  const VAPID_KEY = "BIBl3TVdZLis66oJC9_FOa0R6iblF-MoHWSjiRlBXYXWEjcrVAzq1bOpO_iN58UxBXD9bznkUunDJa5hcGFPMcA";

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);
  const tokenField = document.querySelector("#fcm-token-input");

  onMessage(messaging, async (payload) => {
    console.log("Foreground message received:", payload);
    const title = payload.notification?.title || "Remember Me!";
    const body = payload.notification?.body || "You have a birthday reminder.";

    if (Notification.permission === "granted" && "serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(title, {
        body,
        icon: "icon.png",
        requireInteraction: true
      });
    }
  });

  async function initServiceWorkerAndToken(requestIfNeeded = false) {
    if (!("serviceWorker" in navigator)) return;

    try {
      const swReg = await navigator.serviceWorker.register("sw.js");
      console.log("Service Worker registered successfully!");

      if (!("Notification" in window)) return;

      let permission = Notification.permission;
      if (requestIfNeeded && permission === "default") {
        permission = await Notification.requestPermission();
        if (permission === "granted") {
          new Notification("Remember Me!", {
            body: "Notifications are active! You will be alerted 10 days before, 1 day before, and on birthdays."
          });
        }
      }

      updateButtonUI();
      checkBirthdays();

      if (permission === "granted") {
        const readyReg = await navigator.serviceWorker.ready;
        const token = await getToken(messaging, {
          serviceWorkerRegistration: readyReg || swReg,
          vapidKey: VAPID_KEY
        });
        console.log("FCM Token:", token);
        if (tokenField && token) {
          tokenField.value = token;
        }
        return token;
      }
    } catch (err) {
      console.error("Push setup error:", err);
      if (tokenField) {
        tokenField.value = `Error: ${err.message || err}`;
      }
    }
  }

  notifyBtn.addEventListener("click", async () => {
    await initServiceWorkerAndToken(true);
  });

  window.addEventListener("DOMContentLoaded", async () => {
    updateButtonUI();
    await initServiceWorkerAndToken(false);
  });
</script>

</body>
</html>
