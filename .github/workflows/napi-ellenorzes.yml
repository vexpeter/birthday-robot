name: Napi Születésnap Ellenőrző

on:
  schedule:
    # Minden nap reggel 7:00 UTC-kor fut le (ami magyar idő szerint reggel 8:00 / 9:00)
    - cron: '0 7 * * *'
  workflow_dispatch: # Ezzel bármikor kézzel is elindíthatod tesztelni!

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - run: node check.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
